listener 1883 0.0.0.0

# No anonymous clients. Every client must log in.
allow_anonymous false

# Built at container start from .env by docker-compose (hashed with mosquitto_passwd)
password_file /mosquitto/data/passwd

# Per-topic access rules (see mosquitto/config/acl)
acl_file /mosquitto/data/acl

persistence false
log_dest stdout
